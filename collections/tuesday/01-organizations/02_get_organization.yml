info:
  name: Get Organization
  type: http
  seq: 2
  tags:
    - workspace
    - organization
http:
  method: GET
  url: "{{base_url}}/api/v1/organizations/{{organization_id}}"
  headers:
    - name: Accept
      value: application/vnd.api+json
  auth:
    type: bearer
    token: "{{token}}"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.id
      operator: eq
      value: "{{organization_id}}"
