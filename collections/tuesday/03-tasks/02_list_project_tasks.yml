info:
  name: List Project Tasks
  type: http
  seq: 8
  tags:
    - projects
    - task
http:
  method: GET
  url: "{{base_url}}/api/v1/projects/{{project_id}}/tasks"
  headers:
    - name: Accept
      value: application/vnd.api+json
    - name: x-organization
      value: "{{organization_id}}"
  auth:
    type: bearer
    token: "{{token}}"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data
      operator: isArray
