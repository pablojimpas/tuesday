info:
  name: Delete Task
  type: http
  seq: 14
  tags:
    - projects
    - task
http:
  method: DELETE
  url: "{{base_url}}/api/v1/tasks/{{task_id}}"
  headers:
    - name: Accept
      value: application/vnd.api+json
    - name: x-organization
      value: "{{organization_id}}"
  auth:
    type: bearer
    token: "{{token}}"
runtime:
  assertions:
    - expression: res.status
      operator: in
      value: "200,204"
