info:
  name: Delete Organization
  type: http
  seq: 16
  tags:
    - workspace
    - organization
http:
  method: DELETE
  url: "{{base_url}}/api/v1/organizations/{{organization_id}}"
  headers:
    - name: Accept
      value: application/vnd.api+json
  auth:
    type: bearer
    token: "{{token}}"
runtime:
  assertions:
    - expression: res.status
      operator: in
      value: "200,204"
